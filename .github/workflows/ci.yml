name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: admin/requirements-dev.txt
      - run: pip install -r admin/requirements-dev.txt
      - run: ruff check admin tests
      - run: pytest -q
      - name: Compile Python
        run: python -m compileall -q admin
