{% extends "base.html" %}{% block body %}
{% if error %}<div class="msg error">{{error}}</div>{% endif %}
<p>允许管理域名：{{ domains|join(', ') }}</p>
<div class="grid">
<section class="card"><h2>邮箱账户</h2><pre>{{ accounts }}</pre>
<h3>新增邮箱</h3><form method="post" action="{{url_for('add_account')}}"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><input name="email" type="email" placeholder="user@mv3.cn" required><input name="password" type="password" minlength="12" autocomplete="new-password" required><button>创建</button></form>
<h3>修改密码</h3><form method="post" action="{{url_for('update_password')}}"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><input name="email" type="email" required><input name="password" type="password" minlength="12" autocomplete="new-password" required><button>修改</button></form>
<h3>设置容量</h3><form method="post" action="{{url_for('set_quota')}}"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><input name="email" type="email" required><input name="quota" placeholder="1G" required><button>设置</button></form>
<h3>发送/接收限制</h3><form method="post" action="{{url_for('restrict')}}"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><input name="email" type="email" required><select name="direction"><option value="send">发送</option><option value="receive">接收</option></select><select name="mode"><option value="add">限制</option><option value="del">恢复</option></select><button>执行</button></form>
<h3>删除邮箱</h3><form method="post" action="{{url_for('delete_account')}}"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><input name="email" type="email" placeholder="要删除的邮箱" required><input name="confirm" type="text" placeholder="再次完整输入邮箱确认" required><button class="danger">永久删除</button></form></section>
<section class="card"><h2>邮箱别名</h2><pre>{{ aliases }}</pre>
<h3>新增别名</h3><form method="post" action="{{url_for('add_alias')}}"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><input name="alias" type="email" required><input name="recipient" type="email" required><button>添加</button></form>
<h3>删除别名</h3><form method="post" action="{{url_for('delete_alias')}}"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><input name="alias" type="email" required><input name="recipient" type="email" required><button class="danger">删除</button></form></section>
</div>{% endblock %}
