<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Mail Server Admin{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body><main class="wrap">
<header><h1>Mail Server Admin</h1>{% if session.get('admin') %}<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button>退出</button></form>{% endif %}</header>
{% for category,message in get_flashed_messages(with_categories=true) %}<div class="msg {{category}}">{{message}}</div>{% endfor %}
{% block body %}{% endblock %}
</main></body></html>
